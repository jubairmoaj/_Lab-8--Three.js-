<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Three.js Final Project - Car On The Road</title>
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            background: #050607;
            cursor: crosshair;
        }

        #hud {
            position: fixed;
            top: 12px;
            left: 12px;
            padding: 10px 12px;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #f3f6ff;
            font-size: 13px;
            line-height: 1.45;
            border-radius: 8px;
            user-select: none;
        }

        #hud b {
            color: #ffe084;
        }
    </style>
</head>

<body>
    <div id="hud">
        <div><b>Keyboard:</b> A/D or Left/Right = move camera around car</div>
        <div><b>Keyboard:</b> W/S = camera height, Q/E = zoom in/out</div>
        <div><b>Mouse:</b> move = light position, wheel = light height</div>
    </div>

    <!-- Three.js renders the 3D scene. GLTFLoader loads the car model. DRACOLoader decodes the compressed Ferrari model. -->
    <script src="js/three.js"></script>
    <script src="js/GLTFLoader.js"></script>
    <script src="js/DRACOLoader.js"></script>

    <!-- Custom shaders are used for the road so the mouse-controlled point light affects it clearly. -->
    <script id="litVertex" type="x-shader/x-vertex">
        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vWorldPos;

        void main() {
            vUv = uv;
            vNormal = normalize(normalMatrix * normal);

            vec4 worldPos = modelMatrix * vec4(position, 1.0);
            vWorldPos = worldPos.xyz;

            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    </script>

    <script id="litFragment" type="x-shader/x-fragment">
        uniform sampler2D uTexture;
        uniform vec3 uLightPos;
        uniform vec3 uLightColor;
        uniform vec3 uAmbientColor;
        uniform vec3 uTint;
        uniform vec3 uViewPos;
        uniform vec2 uUvScale;
        uniform vec2 uUvOffset;

        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vWorldPos;

        void main() {
            vec2 sampleUv = vUv * uUvScale + uUvOffset;
            vec3 texColor = texture2D(uTexture, sampleUv).rgb;
            vec3 base = texColor * uTint;

            vec3 N = normalize(vNormal);
            vec3 L = normalize(uLightPos - vWorldPos);
            vec3 V = normalize(uViewPos - vWorldPos);
            vec3 H = normalize(L + V);

            float diff = max(dot(N, L), 0.0);
            float spec = pow(max(dot(N, H), 0.0), 30.0);

            vec3 lit = base * (uAmbientColor + diff * uLightColor) + (0.22 * spec * uLightColor);
            gl_FragColor = vec4(lit, 1.0);
        }
    </script>

    <script>
        // Basic Three.js setup: scene holds objects, renderer draws them, camera views them.
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b111a);
        scene.fog = new THREE.Fog(0x172233, 85, 210);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio || 1);
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(renderer.domElement);

        // Perspective projection gives depth, like a real camera lens.
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 500);

        // These values control the camera orbit around the center car position.
        const cameraOrbit = {
            angle: 0,
            radius: 12,
            height: 4
        };

        function updateCamera() {
            camera.position.x = Math.cos(cameraOrbit.angle) * cameraOrbit.radius;
            camera.position.z = Math.sin(cameraOrbit.angle) * cameraOrbit.radius;
            camera.position.y = cameraOrbit.height;
            camera.lookAt(0, 1.25, 0);
        }

        updateCamera();

        function createSkyTexture() {
            // A canvas texture makes the sky without needing an external image file.
            const width = 2048;
            const height = 1024;
            const c = document.createElement("canvas");
            c.width = width;
            c.height = height;
            const g = c.getContext("2d");

            const skyGradient = g.createLinearGradient(0, 0, 0, height);
            skyGradient.addColorStop(0, "#020612");
            skyGradient.addColorStop(0.35, "#08162b");
            skyGradient.addColorStop(0.66, "#1d3145");
            skyGradient.addColorStop(1, "#5c6d72");
            g.fillStyle = skyGradient;
            g.fillRect(0, 0, width, height);

            const horizonGlow = g.createLinearGradient(0, height * 0.52, 0, height);
            horizonGlow.addColorStop(0, "rgba(255,255,255,0)");
            horizonGlow.addColorStop(0.62, "rgba(245,214,170,0.16)");
            horizonGlow.addColorStop(1, "rgba(128,156,155,0.22)");
            g.fillStyle = horizonGlow;
            g.fillRect(0, 0, width, height);

            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.ClampToEdgeWrapping;
            tex.encoding = THREE.sRGBEncoding;
            return tex;
        }

        function createMoonGlowTexture() {
            const size = 256;
            const c = document.createElement("canvas");
            c.width = size;
            c.height = size;
            const g = c.getContext("2d");
            const glow = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
            glow.addColorStop(0, "rgba(255,246,218,0.9)");
            glow.addColorStop(0.26, "rgba(255,238,190,0.42)");
            glow.addColorStop(1, "rgba(255,238,190,0)");
            g.fillStyle = glow;
            g.fillRect(0, 0, size, size);

            const tex = new THREE.CanvasTexture(c);
            tex.encoding = THREE.sRGBEncoding;
            return tex;
        }

        function createCloudTexture() {
            const size = 512;
            const c = document.createElement("canvas");
            c.width = size;
            c.height = size;
            const g = c.getContext("2d");

            g.clearRect(0, 0, size, size);
            g.globalCompositeOperation = "source-over";

            const puffs = [
                [150, 270, 110, 42],
                [230, 230, 150, 58],
                [330, 270, 125, 46],
                [265, 295, 190, 45],
                [105, 305, 90, 30],
                [405, 310, 95, 32]
            ];

            for (let i = 0; i < puffs.length; i++) {
                const puff = puffs[i];
                const gradient = g.createRadialGradient(puff[0], puff[1], 8, puff[0], puff[1], puff[2]);
                gradient.addColorStop(0, "rgba(235,243,255,0.46)");
                gradient.addColorStop(0.52, "rgba(190,210,226,0.25)");
                gradient.addColorStop(1, "rgba(190,210,226,0)");
                g.fillStyle = gradient;
                g.beginPath();
                g.ellipse(puff[0], puff[1], puff[2], puff[3], 0, 0, Math.PI * 2);
                g.fill();
            }

            const tex = new THREE.CanvasTexture(c);
            tex.encoding = THREE.sRGBEncoding;
            return tex;
        }

        function createStarField() {
            // Stars are real points in the scene. The shader changes brightness over time.
            const starCount = 620;
            const positions = new Float32Array(starCount * 3);
            const phases = new Float32Array(starCount);
            const speeds = new Float32Array(starCount);
            const sizes = new Float32Array(starCount);
            const radius = 205;
            const moonDirection = moonPosition.clone().normalize();
            const moonClearCos = Math.cos(THREE.MathUtils.degToRad(24));
            const moonSoftCos = Math.cos(THREE.MathUtils.degToRad(38));
            const candidateDirection = new THREE.Vector3();

            for (let i = 0; i < starCount; i++) {
                const i3 = i * 3;
                let x = 0;
                let y = 0;
                let z = 0;
                let accepted = false;

                while (!accepted) {
                    const elevation = THREE.MathUtils.degToRad(5 + Math.random() * 48);
                    const azimuth = i < starCount * 0.52
                        ? Math.PI * 1.5 + (Math.random() - 0.5) * 1.35
                        : Math.random() * Math.PI * 2;
                    const distance = radius - Math.random() * 18;

                    x = Math.cos(elevation) * Math.sin(azimuth) * distance;
                    y = Math.sin(elevation) * distance;
                    z = Math.cos(elevation) * Math.cos(azimuth) * distance;

                    candidateDirection.set(x, y, z).normalize();
                    const moonCloseness = candidateDirection.dot(moonDirection);

                    if (moonCloseness > moonClearCos) {
                        continue;
                    }

                    accepted = moonCloseness <= moonSoftCos || Math.random() > 0.9;
                }

                positions[i3] = x;
                positions[i3 + 1] = y;
                positions[i3 + 2] = z;
                phases[i] = Math.random() * Math.PI * 2;
                speeds[i] = 0.7 + Math.random() * 1.8;
                sizes[i] = 2.3 + Math.random() * 2.6;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute("aPhase", new THREE.BufferAttribute(phases, 1));
            geometry.setAttribute("aSpeed", new THREE.BufferAttribute(speeds, 1));
            geometry.setAttribute("aBaseSize", new THREE.BufferAttribute(sizes, 1));

            const material = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uPixelRatio: { value: renderer.getPixelRatio() }
                },
                vertexShader: [
                    "attribute float aPhase;",
                    "attribute float aSpeed;",
                    "attribute float aBaseSize;",
                    "uniform float uTime;",
                    "uniform float uPixelRatio;",
                    "varying float vAlpha;",
                    "void main() {",
                    "    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);",
                    "    float twinkle = 0.55 + 0.45 * sin(uTime * aSpeed + aPhase);",
                    "    vAlpha = 0.34 + twinkle * 0.66;",
                    "    gl_PointSize = aBaseSize * uPixelRatio * (260.0 / -mvPosition.z);",
                    "    gl_Position = projectionMatrix * mvPosition;",
                    "}"
                ].join("\n"),
                fragmentShader: [
                    "varying float vAlpha;",
                    "void main() {",
                    "    vec2 p = gl_PointCoord - vec2(0.5);",
                    "    float d = length(p);",
                    "    float glow = smoothstep(0.5, 0.0, d);",
                    "    float core = smoothstep(0.17, 0.0, d);",
                    "    float alpha = (glow * 0.58 + core * 0.86) * vAlpha;",
                    "    gl_FragColor = vec4(0.88, 0.94, 1.0, alpha);",
                    "}"
                ].join("\n"),
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                fog: false
            });

            const stars = new THREE.Points(geometry, material);
            stars.name = "Twinkling Star Field";
            return stars;
        }

        // The sky is a large sphere viewed from the inside.
        const skyDome = new THREE.Mesh(
            new THREE.SphereGeometry(220, 64, 32),
            new THREE.MeshBasicMaterial({
                map: createSkyTexture(),
                side: THREE.BackSide,
                fog: false,
                depthWrite: false
            })
        );
        skyDome.name = "Procedural Sky Dome";
        scene.add(skyDome);

        const moonPosition = new THREE.Vector3(-92, 22, -18);
        const moon = new THREE.Mesh(
            new THREE.SphereGeometry(4.2, 32, 16),
            new THREE.MeshBasicMaterial({ color: 0xfff4d6, fog: false })
        );
        moon.name = "Moon";
        moon.position.copy(moonPosition);
        scene.add(moon);

        const moonGlow = new THREE.Sprite(
            new THREE.SpriteMaterial({
                map: createMoonGlowTexture(),
                transparent: true,
                depthWrite: false,
                opacity: 0.9,
                blending: THREE.AdditiveBlending,
                fog: false
            })
        );
        moonGlow.name = "Moon Glow";
        moonGlow.position.copy(moonPosition);
        moonGlow.scale.set(38, 38, 1);
        scene.add(moonGlow);

        const moonLight = new THREE.DirectionalLight(0x9eb8ff, 0.24);
        moonLight.position.copy(moonPosition);
        scene.add(moonLight);

        const starField = createStarField();
        scene.add(starField);

        const cloudTexture = createCloudTexture();
        const movingClouds = [];

        function addMovingCloud(x, y, z, width, height, speed, opacity) {
            const cloud = new THREE.Sprite(
                new THREE.SpriteMaterial({
                    map: cloudTexture,
                    transparent: true,
                    opacity: opacity,
                    depthWrite: false,
                    fog: false
                })
            );

            cloud.position.set(x, y, z);
            cloud.scale.set(width, height, 1);
            cloud.renderOrder = -2;
            cloud.userData.speed = speed;
            cloud.userData.baseOpacity = opacity;
            cloud.userData.phase = Math.random() * Math.PI * 2;
            scene.add(cloud);
            movingClouds.push(cloud);
        }

        addMovingCloud(-125, 29, -82, 44, 12, 4.6, 0.33);
        addMovingCloud(-132, 36, -34, 58, 14, 3.4, 0.26);
        addMovingCloud(-118, 25, 30, 50, 12, 5.2, 0.3);
        addMovingCloud(-138, 41, 78, 64, 16, 2.6, 0.22);
        addMovingCloud(-128, 33, 118, 48, 11, 4.0, 0.28);

        function updateSkyAnimation(delta, elapsed) {
            starField.material.uniforms.uTime.value = elapsed;

            for (let i = 0; i < movingClouds.length; i++) {
                const cloud = movingClouds[i];
                cloud.position.z += cloud.userData.speed * delta;

                if (cloud.position.z > 135) {
                    cloud.position.z = -120;
                }

                cloud.material.opacity = cloud.userData.baseOpacity +
                    Math.sin(elapsed * 0.35 + cloud.userData.phase) * 0.035;
            }
        }

        // Ambient and hemisphere lights give soft base light. The point light is the main movable light.
        const ambient = new THREE.AmbientLight(0x3a4657, 0.58);
        scene.add(ambient);

        const pointLight = new THREE.PointLight(0xfff2cc, 1.95, 150);
        scene.add(pointLight);

        const fillLight = new THREE.HemisphereLight(0x88a8ff, 0x1c2d1c, 0.28);
        scene.add(fillLight);

        const lightMarker = new THREE.Mesh(
            new THREE.SphereGeometry(0.16, 12, 12),
            new THREE.MeshBasicMaterial({ color: 0xfff2cc })
        );
        scene.add(lightMarker);

        // lightState stores the actual light position. target is where the mouse wants it to go.
        const lightState = {
            position: new THREE.Vector3(0, 5, 0),
            target: new THREE.Vector3(0, 5, 0),
            height: 5,
            minHeight: 1.5,
            maxHeight: 10
        };

        // Raycaster converts the 2D mouse position into a 3D point on the road plane.
        const lightControl = {
            hasPointer: true,
            clientX: window.innerWidth / 2,
            clientY: window.innerHeight / 2,
            pointer: new THREE.Vector2(),
            raycaster: new THREE.Raycaster(),
            roadPlane: new THREE.Plane(new THREE.Vector3(0, 1, 0), 0),
            heightPlane: new THREE.Plane(new THREE.Vector3(0, 1, 0), -lightState.height),
            hitPoint: new THREE.Vector3(),
            maxX: 18,
            maxZ: 70,
            smoothing: 18
        };

        function updateLightPosition(delta) {
            // Smoothly move the light toward the mouse target instead of jumping instantly.
            const alpha = delta === undefined ? 1 : 1 - Math.exp(-lightControl.smoothing * delta);
            lightState.position.lerp(lightState.target, alpha);
            pointLight.position.copy(lightState.position);
            lightMarker.position.copy(pointLight.position);
        }

        function setLightTargetFromPointer() {
            if (!lightControl.hasPointer) {
                return;
            }

            // Convert mouse pixels into normalized device coordinates: -1 to +1.
            const rect = renderer.domElement.getBoundingClientRect();
            const x = ((lightControl.clientX - rect.left) / rect.width) * 2 - 1;
            const y = -((lightControl.clientY - rect.top) / rect.height) * 2 + 1;

            lightControl.pointer.set(
                THREE.MathUtils.clamp(x, -1, 1),
                THREE.MathUtils.clamp(y, -1, 1)
            );
            lightControl.raycaster.setFromCamera(lightControl.pointer, camera);

            // Intersect the mouse ray with the road plane, then place the light above that hit point.
            const ray = lightControl.raycaster.ray;
            let hit = ray.intersectPlane(lightControl.roadPlane, lightControl.hitPoint);

            if (!hit) {
                lightControl.heightPlane.constant = -lightState.height;
                hit = ray.intersectPlane(lightControl.heightPlane, lightControl.hitPoint);
            }

            if (hit) {
                lightState.target.set(
                    THREE.MathUtils.clamp(lightControl.hitPoint.x, -lightControl.maxX, lightControl.maxX),
                    lightState.height,
                    THREE.MathUtils.clamp(lightControl.hitPoint.z, -lightControl.maxZ, lightControl.maxZ)
                );
            }
        }

        setLightTargetFromPointer();
        updateLightPosition();

        function createRoadTexture() {
            // The road texture is generated with canvas: asphalt noise, side lines, and center dashes.
            const size = 1024;
            const c = document.createElement("canvas");
            c.width = size;
            c.height = size;
            const g = c.getContext("2d");

            g.fillStyle = "#2f3338";
            g.fillRect(0, 0, size, size);

            for (let i = 0; i < 3200; i++) {
                const x = Math.random() * size;
                const y = Math.random() * size;
                const shade = 42 + Math.floor(Math.random() * 38);
                g.fillStyle = "rgb(" + shade + "," + shade + "," + shade + ")";
                g.fillRect(x, y, 2, 2);
            }

            g.fillStyle = "#d7d7d7";
            g.fillRect(size * 0.16, 0, 8, size);
            g.fillRect(size * 0.84, 0, 8, size);

            g.fillStyle = "#f2d072";
            const dashCount = 22;
            for (let i = 0; i < dashCount; i++) {
                const y = (i / dashCount) * size;
                g.fillRect(size * 0.5 - 6, y, 12, size / (dashCount * 2.15));
            }

            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(6, 24);
            tex.encoding = THREE.sRGBEncoding;
            return tex;
        }

        // Road settings. Multiple segments move and recycle to create an endless-road illusion.
        const roadTexture = createRoadTexture();
        const roadMoveSpeed = 6.2;
        const roadSegmentLength = 40;
        const roadSegmentCount = 7;
        const roadTrackLength = roadSegmentLength * roadSegmentCount;
        const roadHalfSpan = Math.floor(roadSegmentCount / 2) * roadSegmentLength;
        const roadSegments = [];
        const roadsideSegments = [];

        const commonVertex = document.getElementById("litVertex").textContent;
        const commonFragment = document.getElementById("litFragment").textContent;

        // ShaderMaterial receives the road texture, the light position, and the camera position.
        const roadMaterial = new THREE.ShaderMaterial({
            uniforms: {
                uTexture: { value: roadTexture },
                uLightPos: { value: pointLight.position },
                uLightColor: { value: new THREE.Color(0.95, 0.93, 0.85) },
                uAmbientColor: { value: new THREE.Color(0.24, 0.24, 0.24) },
                uTint: { value: new THREE.Color(0.82, 0.82, 0.82) },
                uViewPos: { value: camera.position.clone() },
                uUvScale: { value: new THREE.Vector2(1, 3) },
                uUvOffset: { value: new THREE.Vector2(0, 0) }
            },
            vertexShader: commonVertex,
            fragmentShader: commonFragment,
            side: THREE.DoubleSide
        });

        const buildingBodyGeometry = new THREE.BoxGeometry(1, 1, 1);
        const buildingRoofGeometry = new THREE.BoxGeometry(1, 1, 1);
        const windowGeometry = new THREE.BoxGeometry(0.06, 0.32, 0.42);
        const trunkGeometry = new THREE.CylinderGeometry(0.12, 0.16, 1.2, 10);
        const treeTopGeometry = new THREE.ConeGeometry(0.72, 1.6, 12);
        const buildingMaterials = [
            new THREE.MeshPhongMaterial({ color: 0x4d5968, shininess: 20 }),
            new THREE.MeshPhongMaterial({ color: 0x665f58, shininess: 18 }),
            new THREE.MeshPhongMaterial({ color: 0x596b61, shininess: 18 }),
            new THREE.MeshPhongMaterial({ color: 0x6d5962, shininess: 16 })
        ];
        const buildingRoofMaterial = new THREE.MeshPhongMaterial({ color: 0x22262d, shininess: 35 });
        const windowMaterial = new THREE.MeshBasicMaterial({ color: 0xb8d7ff });
        const trunkMaterial = new THREE.MeshPhongMaterial({ color: 0x5b3520, shininess: 8 });
        const leafMaterials = [
            new THREE.MeshPhongMaterial({ color: 0x1f6f3a, shininess: 10 }),
            new THREE.MeshPhongMaterial({ color: 0x2d813f, shininess: 10 }),
            new THREE.MeshPhongMaterial({ color: 0x3b6d2d, shininess: 8 })
        ];

        function createBuilding(localX, localZ, width, height, depth, materialIndex, rows, columns) {
            const group = new THREE.Group();
            group.position.set(localX, 0, localZ);

            const body = new THREE.Mesh(buildingBodyGeometry, buildingMaterials[materialIndex % buildingMaterials.length]);
            body.scale.set(width, height, depth);
            body.position.y = height / 2;
            group.add(body);

            const roof = new THREE.Mesh(buildingRoofGeometry, buildingRoofMaterial);
            roof.scale.set(width * 1.08, 0.22, depth * 1.08);
            roof.position.y = height + 0.11;
            group.add(roof);

            // Windows are placed only on the face looking toward the road.
            const side = localX > 0 ? 1 : -1;
            const faceX = -side * (width / 2 + 0.04);
            for (let row = 0; row < rows; row++) {
                const y = 1 + row * ((height - 1.6) / Math.max(rows - 1, 1));
                for (let col = 0; col < columns; col++) {
                    const z = -depth / 2 + 0.75 + col * ((depth - 1.5) / Math.max(columns - 1, 1));
                    const windowMesh = new THREE.Mesh(windowGeometry, windowMaterial);
                    windowMesh.position.set(faceX, y, z);
                    group.add(windowMesh);
                }
            }

            return group;
        }

        function createTree(localX, localZ, scale, materialIndex) {
            const group = new THREE.Group();
            group.position.set(localX, 0, localZ);
            group.scale.setScalar(scale);

            const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
            trunk.position.y = 0.6;
            group.add(trunk);

            const treeTop = new THREE.Mesh(treeTopGeometry, leafMaterials[materialIndex % leafMaterials.length]);
            treeTop.position.y = 1.65;
            group.add(treeTop);

            return group;
        }

        function createRoadsideSegment(segmentIndex) {
            // Each scenery segment is separate but moves with the matching road segment.
            const group = new THREE.Group();
            const sideSigns = [-1, 1];

            for (let i = 0; i < sideSigns.length; i++) {
                const side = sideSigns[i];
                const offset = segmentIndex + i;

                group.add(createBuilding(
                    side * (24 + (offset % 2) * 3),
                    -10,
                    4.2 + (offset % 3) * 0.7,
                    4.5 + (offset % 4) * 1.1,
                    6.5,
                    offset,
                    3 + (offset % 2),
                    3
                ));

                group.add(createBuilding(
                    side * (31 + (offset % 3) * 2),
                    12,
                    5.2,
                    6.5 + (offset % 3) * 1.2,
                    7.5,
                    offset + 2,
                    4,
                    4
                ));

                group.add(createTree(side * 18.2, -17, 0.95 + (offset % 2) * 0.12, offset));
                group.add(createTree(side * 19.4, 0, 0.85 + (offset % 3) * 0.1, offset + 1));
                group.add(createTree(side * 18.8, 18, 1.0 + (offset % 2) * 0.1, offset + 2));
            }

            return group;
        }

        // Build seven flat road planes. Matching roadside groups contain buildings and trees.
        for (let i = 0; i < roadSegmentCount; i++) {
            const road = new THREE.Mesh(new THREE.PlaneGeometry(30, roadSegmentLength, 1, 1), roadMaterial);
            road.rotation.x = -Math.PI / 2;
            road.position.y = -0.02;
            road.position.z = (i * roadSegmentLength) - roadHalfSpan;
            scene.add(road);
            roadSegments.push(road);

            const roadside = createRoadsideSegment(i);
            roadside.position.z = road.position.z;
            scene.add(roadside);
            roadsideSegments.push(roadside);
        }

        const importedCarGroup = new THREE.Group();
        importedCarGroup.visible = false;
        scene.add(importedCarGroup);
        const importedWheelMeshes = [];

        function fitImportedCarToRoad(carRoot) {
            // Measure the imported model, scale it to road size, and move it so it sits on the road.
            const bounds = new THREE.Box3().setFromObject(carRoot);
            const size = new THREE.Vector3();
            bounds.getSize(size);

            const targetLength = 4.9;
            const longestSide = Math.max(size.x, size.z);
            const scale = longestSide > 0 ? targetLength / longestSide : 1;
            carRoot.scale.setScalar(scale);

            bounds.setFromObject(carRoot);
            const center = new THREE.Vector3();
            bounds.getCenter(center);

            carRoot.position.set(-center.x, -bounds.min.y + 0.03, -center.z);
        }

        function prepareImportedCarMaterials(carRoot) {
            // Traverse visits every child mesh inside the imported GLB model.
            carRoot.traverse(function (child) {
                if (!child.isMesh) {
                    return;
                }

                child.frustumCulled = false;
                if (child.material) {
                    const materials = Array.isArray(child.material) ? child.material : [child.material];

                    for (let i = 0; i < materials.length; i++) {
                        const material = materials[i];
                        const materialName = material.name ? material.name.toLowerCase() : "";

                        if (materialName.indexOf("glass") !== -1) {
                            material.transparent = true;
                            material.opacity = 0.48;
                            material.depthWrite = false;
                            material.side = THREE.DoubleSide;
                        }

                        material.needsUpdate = true;
                    }
                }
            });
        }

        function collectImportedCarWheels(carRoot) {
            // Store wheel and rim meshes so the animation loop can rotate them.
            importedWheelMeshes.length = 0;

            carRoot.traverse(function (child) {
                if (!child.isMesh) {
                    return;
                }

                const meshName = child.name ? child.name.toLowerCase() : "";
                if (/^wheel(_\d+)?$/.test(meshName) || /^rim_/.test(meshName)) {
                    importedWheelMeshes.push(child);
                }
            });
        }

        if (THREE.GLTFLoader) {
            // GLTFLoader loads the .glb car file from assets/models.
            const carLoader = new THREE.GLTFLoader();

            if (THREE.DRACOLoader) {
                // The Ferrari GLB uses Draco compression, so the loader needs these decoder files.
                const dracoLoader = new THREE.DRACOLoader();
                dracoLoader.setDecoderPath("js/libs/draco/gltf/");
                carLoader.setDRACOLoader(dracoLoader);
            }

            carLoader.load(
                "assets/models/ferrari.glb",
                function (gltf) {
                    // gltf.scene is the actual 3D model hierarchy loaded from ferrari.glb.
                    const importedCar = gltf.scene;
                    importedCar.name = "Real Sports Car";
                    prepareImportedCarMaterials(importedCar);
                    fitImportedCarToRoad(importedCar);
                    collectImportedCarWheels(importedCar);

                    importedCarGroup.add(importedCar);
                    importedCarGroup.visible = true;
                },
                undefined,
                function (error) {
                    console.warn("Could not load the imported car model.", error);
                }
            );
        }

        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(260, 260, 1, 1),
            new THREE.MeshPhongMaterial({ color: 0x243622, shininess: 0 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.05;
        scene.add(ground);

        // keyState remembers which camera-control keys are currently pressed.
        const keyState = {};
        const controlKeys = new Set([
            "arrowleft",
            "arrowright",
            "arrowup",
            "arrowdown",
            "a",
            "d",
            "w",
            "s",
            "q",
            "e"
        ]);

        document.addEventListener("keydown", function (e) {
            const key = e.key.toLowerCase();
            keyState[key] = true;
            if (controlKeys.has(key)) {
                e.preventDefault();
            }
        });

        document.addEventListener("keyup", function (e) {
            keyState[e.key.toLowerCase()] = false;
        });

        renderer.domElement.addEventListener("pointermove", function (e) {
            // Mouse movement controls the point light position on the road.
            lightControl.hasPointer = true;
            lightControl.clientX = e.clientX;
            lightControl.clientY = e.clientY;
            setLightTargetFromPointer();
        });

        renderer.domElement.addEventListener("wheel", function (e) {
            // Mouse wheel changes the light height.
            e.preventDefault();
            lightState.height = THREE.MathUtils.clamp(
                lightState.height - e.deltaY * 0.005,
                lightState.minHeight,
                lightState.maxHeight
            );
            setLightTargetFromPointer();
        }, { passive: false });

        function handleKeyboard(delta) {
            const orbitSpeed = 1.6;
            const zoomSpeed = 7;
            const heightSpeed = 6;

            if (keyState["arrowleft"] || keyState["a"]) {
                cameraOrbit.angle += orbitSpeed * delta;
            }
            if (keyState["arrowright"] || keyState["d"]) {
                cameraOrbit.angle -= orbitSpeed * delta;
            }
            if (keyState["q"]) {
                cameraOrbit.radius += zoomSpeed * delta;
            }
            if (keyState["e"]) {
                cameraOrbit.radius -= zoomSpeed * delta;
            }
            if (keyState["w"] || keyState["arrowup"]) {
                cameraOrbit.height += heightSpeed * delta;
            }
            if (keyState["s"] || keyState["arrowdown"]) {
                cameraOrbit.height -= heightSpeed * delta;
            }

            cameraOrbit.radius = THREE.MathUtils.clamp(cameraOrbit.radius, 6, 32);
            cameraOrbit.height = THREE.MathUtils.clamp(cameraOrbit.height, 1.8, 14);
        }

        const clock = new THREE.Clock();

        function animate() {
            // This function runs every frame: update controls, move road, spin wheels, then render.
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            handleKeyboard(delta);
            updateCamera();
            setLightTargetFromPointer();
            updateLightPosition(delta);
            updateSkyAnimation(delta, clock.elapsedTime);

            roadMaterial.uniforms.uViewPos.value.copy(camera.position);

            // Move road segments and their roadside scenery; recycle old segments to keep the road endless.
            for (let i = 0; i < roadSegments.length; i++) {
                const segment = roadSegments[i];
                segment.position.z += roadMoveSpeed * delta;
                if (segment.position.z > roadHalfSpan) {
                    segment.position.z -= roadTrackLength;
                }
                roadsideSegments[i].position.z = segment.position.z;
            }

            // Rotate imported wheel meshes so the car looks like it is moving.
            const wheelSpin = roadMoveSpeed * 2.6;
            for (let i = 0; i < importedWheelMeshes.length; i++) {
                importedWheelMeshes[i].rotation.x -= wheelSpin * delta;
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener("resize", function () {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            starField.material.uniforms.uPixelRatio.value = renderer.getPixelRatio();
        });
    </script>
</body>

</html>
